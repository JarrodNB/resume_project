# Detect rate drift without changing billed history or calling paid models.
name: Check AI prices
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  pull_request:
    paths:
      - 'services/ai/worker/model_prices.py'
      - 'services/api/config/ai_embedding_prices.json'
      - 'script/check_ai_prices.py'
      - '.github/workflows/check-ai-prices.yml'
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'genai-prices==0.1.9'
      - run: python script/check_ai_prices.py
