# Runs each service's tests and lint on pull requests, so a broken change shows up before it
# merges. Free on GitHub's hosted runners because the repo is public. Only the services a PR
# touches are tested; the rest report "skipped", which still counts as passing for required
# checks. AI tests run offline (no model keys, no paid evals); database-marked AI tests are
# left out because they need the Rails-built schema and ai_reader grants.
name: CI
on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still testing the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which services changed. A change to this workflow tests everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.diff.outputs.api }}
      ai: ${{ steps.diff.outputs.ai }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            files=.github/workflows/ci.yml
          else
            files=$(git diff --name-only "$BASE_SHA"...HEAD)
          fi
          echo "$files"
          # Rails and web specs also read the shared fixtures in services/ai/tests/fixtures/.
          shared=services/ai/tests/fixtures/
          for pair in "api:services/api/|$shared" ai:services/ai/ "web:apps/web/|$shared"; do
            name=${pair%%:*}
            if grep -qE "^(${pair#*:}|\.github/workflows/ci\.yml$)" <<<"$files"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Placeholder keys and local AWS values match docker-compose.yml; specs stub every request.
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      OPENAI_API_KEY: ci-placeholder
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      # The runner image already has libpq-dev for the pg gem, so no apt step is needed.
      # Same init script as the local database, so the ai_reader role exists for grant specs.
      - run: psql -h localhost -U postgres -f ../../infra/postgres/init/01_create_ai_reader_role.sql
        env:
          PGPASSWORD: postgres
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: services/api
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bundle exec rspec

  ai:
    needs: changes
    if: needs.changes.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same base image as services/ai/Dockerfile.dev, so ffmpeg's audio decoding matches local.
    container: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    # Placeholder key lets agents build their provider; tests never send model requests.
    env:
      OPENAI_API_KEY: ci-placeholder
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -m "not db"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
