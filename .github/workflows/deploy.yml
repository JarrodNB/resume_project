# Builds the four production images on merge to master, pushes them to ECR, and restarts the
# server on the new images. AWS access comes from OIDC (no stored keys); the role only trusts
# runs on master (see infra/terraform/modules/github).
name: Deploy
on:
  push:
    branches: [master]
    paths:
      - 'services/api/**'
      - 'services/ai/**'
      - 'apps/web/**'
      - 'apps/landing/**'
      - 'infra/compose/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time; a newer push waits instead of racing the one in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::016170038537:role/jobapp-github-deploy
  REGISTRY: 016170038537.dkr.ecr.us-east-2.amazonaws.com
  DOMAIN: careerdrafter.app

jobs:
  # Decides which images need building. Each image is tagged with a hash of its own source
  # folder, so an image whose folder did not change already exists in ECR and is skipped,
  # and compose only restarts the services whose tag changed.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: plan
        run: |
          declare -A DIR=( [api]=services/api [ai]=services/ai [web]=apps/web [landing]=apps/landing )
          declare -A ARGS=( [web]=$'VITE_API_URL=https://api.'"${DOMAIN}"$'\nVITE_TURNSTILE_SITE_KEY=0x4AAAAAAGKX0TewIss46Oq-' [landing]="VITE_APP_URL=https://app.${DOMAIN}" )
          build='[]'
          tags='{}'
          for img in api ai web landing; do
            tree=$(git rev-parse "HEAD:${DIR[$img]}")
            # Build args are baked into web and landing, so they are part of the tag.
            argsum=$(printf '%s' "${ARGS[$img]:-}" | sha256sum | cut -c1-6)
            tag="${tree:0:12}-${argsum}"
            tags=$(jq -c --arg k "$img" --arg v "$tag" '. + {($k): $v}' <<<"$tags")
            if aws ecr describe-images --repository-name "jobapp/$img" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              echo "$img: $tag already built, skipping"
            else
              echo "$img: $tag needs a build"
              build=$(jq -c --arg i "$img" --arg c "${DIR[$img]}" --arg a "${ARGS[$img]:-}" --arg t "$tag" '. + [{image:$i, context:$c, args:$a, tag:$t}]' <<<"$build")
            fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.args }}
          tags: ${{ env.REGISTRY }}/jobapp/${{ matrix.image }}:${{ matrix.tag }}
          # Layer cache in the GitHub cache, so unchanged dependency layers are not rebuilt.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [plan, build]
    # Runs when nothing needed building too: compose files may have changed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Restarting ai-live can wait up to 30 minutes for a running live interview to end.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The compose files live in git, so ship them with each deploy. The server's .env and
      # settings.env are never touched (they hold its secrets and settings and are not in the archive).
      - name: Stage compose files
        run: |
          tar czf compose.tgz -C infra/compose --exclude=.env --exclude=settings.env --exclude=.gitignore .
          aws s3 cp --only-show-errors compose.tgz "s3://jobapp-backups-016170038537/deploy/compose-${GITHUB_SHA}.tgz"

      # `compose up -d` only recreates services whose image tag or config changed.
      - name: Restart changed services
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          SERVER=$(aws ec2 describe-instances --filters Name=tag:Name,Values=jobapp Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          TAGENV="API_TAG=$(jq -r .api <<<"$TAGS") AI_TAG=$(jq -r .ai <<<"$TAGS") WEB_TAG=$(jq -r .web <<<"$TAGS") LANDING_TAG=$(jq -r .landing <<<"$TAGS")"
          CMD="set -e; cd /opt/app && aws s3 cp --only-show-errors s3://jobapp-backups-016170038537/deploy/compose-${GITHUB_SHA}.tgz - | tar xz && set -a && . ./.env && . ./settings.env && set +a && aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY} >/dev/null && export ${TAGENV} && docker compose pull -q && docker compose up -d --remove-orphans && docker image prune -af --filter until=12h >/dev/null && docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'"
          ID=$(aws ssm send-command --instance-ids "$SERVER" --document-name AWS-RunShellScript \
            --parameters "$(jq -cn --arg c "$CMD" '{commands:[$c],executionTimeout:["2700"]}')" \
            --query Command.CommandId --output text)
          # Wait for the command: pulling images can take a few minutes, and ai-live stops only
          # after its running live interviews end (stop_grace_period in compose.yml).
          for i in $(seq 1 270); do
            status=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$SERVER" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$SERVER" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success

      - name: Check the live site
        run: |
          for url in https://${DOMAIN} https://app.${DOMAIN} https://api.${DOMAIN}/up; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "$url" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$url -> $code"
            test "$code" = 200
          done
