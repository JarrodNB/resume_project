# Description: Local development stack. Run everything with `docker compose up --build`.
# Index:
#   - db: Postgres 17 with pgvector (port 5432)
#   - sqs: ElasticMQ, local SQS emulator (port 9324)
#   - s3: Adobe S3Mock, local S3 emulator for uploaded files (port 9090)
#   - api: Rails GraphQL API (port 3000; GraphQL subscriptions over WebSocket at /cable)
#   - api-results-worker: Shoryuken consumer of ai_results (same image and code as api)
#   - ai: Python SQS worker
#   - web: React app (port 5173)
#   - landing: landing page (port 5174)

x-local-aws: &local-aws
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  SQS_ENDPOINT_URL: http://sqs:9324
  S3_ENDPOINT_URL: http://s3:9090
  S3_UPLOADS_BUCKET: careergrind-uploads

# Keeps Rails' bootsnap cache in a volume, so the root-run containers don't fill the bind-mounted
# tmp/ with root-owned cache files.
x-api-bootsnap: &api-bootsnap
  BOOTSNAP_CACHE_DIR: /bootsnap

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native
    ports:
      - "9324:9324"
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  s3:
    image: adobe/s3mock
    # Files live in the container and are lost when it is recreated; that's fine for dev,
    # since an upload is only needed until the AI worker has parsed it.
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: careergrind-uploads
    ports:
      - "9090:9090"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      <<: [*local-aws, *api-bootsnap]
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "3000:3000"
    volumes:
      - ./services/api:/rails
      - api_bundle:/usr/local/bundle
      - api_bootsnap:/bootsnap
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_started
      s3:
        condition: service_started

  api-results-worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    command: bundle exec shoryuken -R -C config/shoryuken.yml
    # Restarts until the api service has run db:prepare and the queues exist on first boot.
    restart: on-failure
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      <<: [*local-aws, *api-bootsnap]
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    volumes:
      - ./services/api:/rails
      - api_bundle:/usr/local/bundle
      - api_bootsnap:/bootsnap
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_started
      api:
        condition: service_started

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile.dev
    # The polling loop survives errors; this restarts it if startup fails (e.g. SQS not up yet).
    restart: unless-stopped
    env_file:
      - path: ./services/ai/.env
        required: false
    environment:
      <<: *local-aws
      DB_HOST: db
      DB_NAME: api_development
      DB_USERNAME: ai_reader
      DB_PASSWORD: ai_reader
      LANGFUSE_TRACING_ENVIRONMENT: development
    volumes:
      - ./services/ai:/app
    depends_on:
      db:
        condition: service_healthy
      sqs:
        condition: service_started
      s3:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      # GraphQL codegen input, at the same relative path (../../services/api) as on the host.
      - ./services/api/schema.graphql:/services/api/schema.graphql:ro

  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    volumes:
      - ./apps/landing:/app
      - /app/node_modules

volumes:
  db_data:
  api_bundle:
  api_bootsnap:
