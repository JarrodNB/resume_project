# Human-only browser access. Bind local ports and align Rails, Cable and signed storage URLs.
services:
  api:
    ports:
      - "127.0.0.2:13006:3000"
    environment:
      CORS_ORIGINS: http://127.0.0.2:15176
      WEB_APP_URL: http://127.0.0.2:15176
      INTERVIEW_BROWSER_STORAGE_ORIGIN: http://127.0.0.2:19096
  s3:
    ports:
      - "127.0.0.2:19096:9090"
  web:
    ports:
      - "127.0.0.2:15176:5173"
