# Synthetic HTTP providers only; use with interview-recovery.compose.yml and project cg-interview-11.
services:
  api:
    image: cg-interview-qa-api
    environment:
      INTERVIEW_ADMISSION_ENABLED: "true"
      INTERVIEW_SYNTHETIC_PROVIDER_CHECK: "true"
      AI_HTTP_ORIGIN: http://ai-http:8000
  api-jobs-worker:
    environment:
      INTERVIEW_SYNTHETIC_PROVIDER_CHECK: "true"
  ai-http:
    image: cg-interview-qa-ai-http
    command: python -m scripts.interview_mock_runtime
    environment:
      INTERVIEW_FAKE_RUNTIME_ENABLED: "false"
      AI_HTTP_ENABLED: "true"
      INTERVIEW_CHECK_AUDIO_FAILURE: ${INTERVIEW_CHECK_AUDIO_FAILURE:-false}
      OPENAI_API_KEY: synthetic-offline
      TYPESAFE_API_KEY: synthetic-offline
      LOGFIRE_TOKEN: ""
      OTEL_SDK_DISABLED: "false"
