# Description: ElasticMQ (local SQS emulator) config. Defines the queues used in local dev.
# Index:
#   - ai_tasks: AI work published by services/api, consumed by services/ai
#   - ai_results: AI results published by services/ai, consumed by services/api
#   - *_dead_letters: messages that failed processing 3 times

include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ai_tasks_dead_letters {}
  ai_results_dead_letters {}

  ai_tasks {
    defaultVisibilityTimeout = 300 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ai_tasks_dead_letters"
      maxReceiveCount = 3
    }
  }

  ai_results {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ai_results_dead_letters"
      maxReceiveCount = 3
    }
  }
}
