- name: critiques_practice_answer_with_current_feedback
  inputs:
    payload:
      conversation_id: synthetic-chat
      user_id: synthetic-user
      message: Can you critique my saved answer to the conflict practice question?
      max_input_characters: 10000
      summarize_every_user_messages: 20
    interview_questions:
    - id: 00000000-0000-0000-0000-000000000031
      set_number: 1
      set_type: behavioral
      position: 1
      question_text: Tell me about a time you resolved a conflict with a coworker.
      answer_format: star
      answer_text: |-
        Situation: Our design and engineering leads disagreed about the launch scope for mobile checkout.
        Task: As project coordinator I owned the release date.
        Action: I ran a joint review where each lead ranked features by customer impact.
        Result: We agreed on a smaller first release and launched two weeks later.
      answer_revision: 2
      answer_format_revision: 2
      feedback:
        strengths: [Clear situation and a specific role as project coordinator.]
        improvements: [Add a measurable result, such as checkout conversion after launch.]
        example_answer: When our design and engineering leads disagreed about mobile checkout scope, I ran a joint review that ranked features by customer impact, and we launched a smaller first release two weeks later.
      feedback_question_revision: 1
      feedback_answer_revision: 2
      screened_fields: [question_text, answer_text]
  metadata:
    required_reply_terms: [checkout]
    forbidden_reply_terms: [I saved, I updated]
    required_tool_calls: [list_interview_questions, read_interview_question]
