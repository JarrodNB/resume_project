# Description: Synthetic full-set and replacement quality evaluation cases.
evaluators:
  - QuestionStructure
cases:
  - name: experienced-collaborator
    inputs:
      library: "Customer support specialist for four years. Created a shared onboarding checklist with two colleagues. Enjoys explaining confusing processes. Wants to move into training."
  - name: sparse-first-job
    inputs:
      library: "Recent history graduate. Volunteered at a community book exchange."
  - name: general-skills-only-behavioral-invitations
    inputs:
      library: "Skills: source comparison. Education: history diploma. No employment experience recorded."
  - name: general-replacement-new-behavioral-set
    inputs:
      count: 1
      library: "Retail assistant. Helped customers find products. Restocked shelves. Learned the stock checking process."
      excluded:
        - "Tell me about your retail background."
        - "Tell me about a time you worked with a colleague to help a customer."
        - "Describe a difficult customer problem and how you approached it."
        - "Tell me about a time you had to learn a new process."
        - "Describe a time you decided which task to prioritize."
  - name: technical-career-nontechnical-interview
    inputs:
      library: "Software developer using Python and PostgreSQL. Worked with designers to clarify accessibility issues. Presented project progress to nontechnical stakeholders."
  - name: individual-contributor-no-invented-leadership
    inputs:
      library: "Warehouse associate. Followed the existing stock checking procedure. Reported damaged packages to a supervisor. No management experience."
  - name: replacement-semantic-distinctness
    inputs:
      library: "Museum visitor assistant. Helped visitors find exhibits. Co-created an orientation leaflet. Wants to improve public speaking."
      count: 1
      excluded:
        - "Tell me about your museum visitor assistant experience."
        - "What strengths help you guide visitors?"
        - "How would you develop your public speaking?"
        - "What are your longer-term career goals?"
        - "Describe collaborating on the orientation leaflet."
  - name: technical-software-practical-work
    inputs:
      set_type: technical
      library: "Software developer. Built a Python import worker using PostgreSQL. Added duplicate-message checks and automated tests. Compared batching approaches before choosing smaller transactions."
  - name: technical-warehouse-practical-work
    inputs:
      set_type: technical
      library: "Warehouse associate. Used barcode scanners and the existing stock checking procedure. Compared package labels with the picking list. Reported damaged packages to a supervisor. Helped update a handover checklist."
  - name: technical-sparse-education
    inputs:
      set_type: technical
      library: "Recent history graduate. Skills: archival research and source comparison."
  - name: technical-replacement-retains-practical-scope
    inputs:
      set_type: technical
      count: 1
      library: "Bakery assistant. Weighed ingredients using a digital scale. Followed recipe cards. Checked oven temperature and product appearance. Recorded batch details. Helped label stored ingredients."
      excluded:
        - "Walk me through weighing ingredients using a digital scale."
        - "How do you use recipe cards in your work?"
        - "What decisions do you make when checking oven temperature?"
        - "Tell me about a problem you encountered while recording batch details."
        - "How do you check the appearance of products for quality?"
  - name: knowledge-python-subjects
    inputs:
      set_type: knowledge
      library: "Python engineer. Skills: Python and PostgreSQL."
  - name: knowledge-nontechnology-food-safety
    inputs:
      set_type: knowledge
      library: "Catering assistant. Completed food safety training. Skills: safe food storage and allergen awareness."
  - name: knowledge-sparse-source-comparison
    inputs:
      set_type: knowledge
      library: "Skills: historical source comparison."
  - name: knowledge-replacement-distinct-subject
    inputs:
      set_type: knowledge
      count: 1
      library: "Skills: Python."
      excluded:
        - "What is the difference between a Python list and a tuple?"
        - "How does Python's name binding relate to mutable objects?"
        - "How would you use a dictionary to count words?"
        - "Why does changing a mutable default argument affect later calls?"
        - "What limitations does the global interpreter lock impose on CPU-bound threads?"

  - name: general-full-set-saved-preferences
    inputs:
      library: "Retail assistant. Helped customers find products. Restocked shelves. Learned stock checking. Previously volunteered at a community book exchange."
      excluded:
        - "Tell me about a time you disagreed with a colleague over a customer request."
        - "Describe a time you applied feedback while learning the stock checking process."
  - name: technical-full-set-saved-voice-question
    inputs:
      set_type: technical
      library: "Bakery assistant. Weighed ingredients using a digital scale. Followed recipe cards. Checked oven temperature and product appearance. Recorded batch details. Helped label stored ingredients."
      excluded:
        - "Walk me through weighing ingredients using a digital scale."
  - name: knowledge-full-set-saved-preferences
    inputs:
      set_type: knowledge
      library: "Skills: Python and PostgreSQL."
      excluded:
        - "What is the difference between a Python list and a tuple?"
        - "How does Python's name binding relate to mutable objects?"
  - name: general-full-set-specific-background-angle
    inputs:
      library: "Customer support specialist for four years. Previously volunteered at a community book exchange. Created a shared onboarding checklist with two colleagues. Wants to move into training."
      excluded:
        - "What first interested you in customer support?"
