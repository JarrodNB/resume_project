# Description: Hand-labelled eval cases for job posting extraction (heading split + the job
# requirements sorting agent fallback). All postings are synthetic.
# `inputs` is what the LinkedIn scraper reads off a guest job page: the top card fields and the
# raw description markup (<br>-separated lines, <strong>Heading<br><br></strong> headings).
# Line breaks in description_html only fall between tags, so they add nothing.
# `expected_output` is a ScrapedJobPosting; evaluators compare title, company, location,
# requirements, nice_to_haves, and requirements_sorted_by.
cases:
  - name: bold_headings
    inputs:
      job_id: "1001"
      title: Senior Backend Engineer
      company: Northwind Payments
      location: Seattle, WA
      description_html: |
        <strong>About the role<br><br></strong>We are hiring a backend engineer to scale our ledger platform.<br><br>
        <strong>Responsibilities<br><br></strong><ul><li>Design and operate event-driven services</li><li>Mentor engineers on the payments team<br><br></li></ul>
        <strong>Requirements<br><br></strong><ul><li>5+ years of backend development experience</li><li>Strong Python or Go skills</li><li>Experience with PostgreSQL at scale<br><br></li></ul>
        <strong>Nice to have<br><br></strong><ul><li>Experience in fintech or payments</li><li>Familiarity with Kafka</li></ul>
        <strong>Benefits<br><br></strong><ul><li>Health, dental, and vision insurance</li><li>Flexible remote work</li></ul>
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1001/
      title: Senior Backend Engineer
      company: Northwind Payments
      location: Seattle, WA
      requirements:
        - 5+ years of backend development experience
        - Strong Python or Go skills
        - Experience with PostgreSQL at scale
      responsibilities:
        - Design and operate event-driven services
        - Mentor engineers on the payments team
      nice_to_haves:
        - Experience in fintech or payments
        - Familiarity with Kafka
      requirements_sorted_by: headings

  - name: curly_apostrophes_and_bold_words_in_bullets
    inputs:
      job_id: "1002"
      title: Machine Learning Engineer
      company: Contoso AI
      location: United States
      description_html: |
        Contoso AI builds assistants for hospitals.<br><br>
        <strong>What You’ll Do<br><br></strong><ul><li>Train and evaluate retrieval models</li><li>Ship models to production with the platform team</li></ul>
        <strong>What You’ll Bring<br><br></strong><ul><li>3+ years building ML systems in production</li><li>Hands-on experience with <strong>PyTorch</strong>, and evaluation design</li></ul>
        <strong>Bonus Points<br><br></strong><ul><li>Published research in information retrieval</li></ul>
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1002/
      title: Machine Learning Engineer
      company: Contoso AI
      location: United States
      requirements:
        - 3+ years building ML systems in production
        - Hands-on experience with PyTorch, and evaluation design
      responsibilities:
        - Train and evaluate retrieval models
        - Ship models to production with the platform team
      nice_to_haves:
        - Published research in information retrieval
      requirements_sorted_by: headings

  - name: plain_text_intro_then_minimum_and_preferred
    inputs:
      job_id: "1003"
      title: Data Engineer
      company: Fabrikam
      location: London, England, United Kingdom
      description_html: |
        Who you are<br><br>We're looking for someone who meets the minimum requirements to be considered. The preferred qualifications are a bonus, not a requirement.<br><br>
        <strong>Minimum Requirements<br><br></strong><ul><li>Bachelor's degree in Computer Science or equivalent experience</li><li>Experience building batch pipelines with Spark</li></ul>
        <strong>Preferred Qualifications<br><br></strong><ul><li>Experience with dbt</li><li>Google Cloud certification</li></ul>
        Hybrid work at Fabrikam<br><br>This role is available in our London office or remotely.<br><br>
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1003/
      title: Data Engineer
      company: Fabrikam
      location: London, England, United Kingdom
      requirements:
        - Bachelor's degree in Computer Science or equivalent experience
        - Experience building batch pipelines with Spark
      nice_to_haves:
        - Experience with dbt
        - Google Cloud certification
      requirements_sorted_by: headings

  - name: should_have_and_bonus_points
    inputs:
      job_id: "1008"
      title: Data Scientist
      company: Proseware
      location: San Francisco Bay Area
      description_html: |
        <strong>What you'll be doing<br><br></strong><ul><li>Define KPIs for the client platform</li><li>Champion A/B testing best practices</li></ul>
        <strong>What you should have<br><br></strong><ul><li>2+ years of hands-on analytics experience</li><li>Strong SQL skills</li></ul>
        <strong>Bonus Points<br><br></strong><ul><li>Production ETL or BigQuery experience</li></ul>
        <strong>Why Proseware? <br><br></strong>We make tools for writers.<br><br>
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1008/
      title: Data Scientist
      company: Proseware
      location: San Francisco Bay Area
      requirements:
        - 2+ years of hands-on analytics experience
        - Strong SQL skills
      responsibilities:
        - Define KPIs for the client platform
        - Champion A/B testing best practices
      nice_to_haves:
        - Production ETL or BigQuery experience
      requirements_sorted_by: headings

