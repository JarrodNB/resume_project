      requirements_sorted_by: llm

  - name: prose_only_no_bullets
    inputs:
      job_id: "1007"
      title: Office Manager
      company: Adventure Works
      location: null
      description_html: |
        Adventure Works is looking for an office manager to keep our Denver office running. You will coordinate vendors, plan events, and support a team of forty people.<br><br>
        Experience in a fast-paced office is important to us.
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1007/
      title: Office Manager
      company: Adventure Works
      location: null
      requirements: []
      nice_to_haves: []
      requirements_sorted_by: none
evaluators:
  - RequirementMatch
  - VerbatimBullets
  - SortedByExpectedPath
  - PostingFieldsMatch
