      source_url: https://www.linkedin.com/jobs/view/1006/
      title: Product Designer
      company: Litware
      location: New York, NY
      requirements:
        - A portfolio showing shipped mobile products
        - At least 3 years of product design experience
        - Figma expertise
      responsibilities:
        - Lead design for the onboarding flow
        - Run usability studies every sprint
      nice_to_haves:
