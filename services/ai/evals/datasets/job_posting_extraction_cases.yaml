        <strong>The person<br><br></strong><ul><li>A portfolio showing shipped mobile products</li><li>At least 3 years of product design experience</li><li>Figma expertise</li><li>Motion design skills would be a bonus</li></ul>
        <strong>Perks<br><br></strong><ul><li>Annual learning budget</li></ul>
