  - name: no_headings_flat_bullets
    inputs:
      job_id: "1005"
      title: Platform Engineer
      company: Woodgrove Bank
      location: Toronto, ON, Canada
      description_html: |
        Join the platform team that runs Woodgrove's Kubernetes clusters. In this role you will:<br>
        <ul><li>Run and upgrade our Kubernetes clusters</li><li>Build self-service tooling for product teams</li></ul>
        We think you'll be a great fit if you bring the following.<br>
        <ul><li>4+ years of experience operating Kubernetes in production</li><li>Strong Terraform skills</li><li>Experience with Go is a plus</li></ul>
        We offer a pension plan and four weeks of vacation.
    expected_output:
      source: linkedin
      source_url: https://www.linkedin.com/jobs/view/1005/
      title: Platform Engineer
      company: Woodgrove Bank
      location: Toronto, ON, Canada
      requirements:
