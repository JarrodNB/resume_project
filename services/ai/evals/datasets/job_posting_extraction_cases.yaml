        - Strong Terraform skills
      responsibilities:
        - Run and upgrade our Kubernetes clusters
        - Build self-service tooling for product teams
      nice_to_haves:
        - Experience with Go is a plus
      requirements_sorted_by: llm

  - name: unrecognized_headings
    inputs:
      job_id: "1006"
      title: Product Designer
      company: Litware
      location: New York, NY
