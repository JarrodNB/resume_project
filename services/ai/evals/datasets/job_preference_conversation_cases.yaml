# Synthetic preference intent only; metadata never enters generation input.
cases:
- name: explicit_priorities
  inputs:
    message: I need fully remote work in the United States. Climate work would be a bonus. These are my only preferences.
  metadata:
    required:
      remote: must_have
      climate: nice_to_have
    forbidden_terms: [salary, vacation, equity]
- name: clarify_priority
  inputs:
    message: Remote work sounds good. I have not decided whether it is required.
    answer: Fully remote is a must-have. I can work anywhere in the United States. No other preferences.
  metadata:
    requires_question: true
    required:
      remote: must_have
    forbidden_terms: [salary, vacation, equity]
- name: explicit_compensation_units
  inputs:
    message: My only must-have is at least USD 120000 per year in base salary. I would prefer a four-day week, but it is not required.
  metadata:
    required:
      '120': must_have
      'four': nice_to_have
    forbidden_terms: [remote, equity]
evaluators:
- PreferenceConversationOutcome
