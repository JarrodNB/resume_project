    inputs:
      profile_id: backend-engineer
      career_library:
        - id: backend-highlight
          content: "Backend Engineer at Cedar: Built Ruby services and PostgreSQL APIs for payment processing"
        - id: platform-project
          content: "Project: Payment reliability: Added event retries and monitoring for distributed services"
        - id: backend-skill
          content: "Skills: Ruby, PostgreSQL, REST APIs, distributed systems"
      listings:
        - id: visual-designer
          content: "Visual Designer: Create brand campaigns and illustrations. Figma experience is helpful."
        - id: backend-role
          content: "Backend Software Engineer: Build payment APIs in Ruby, PostgreSQL and distributed systems."
        - id: data-engineer
          content: "Data Engineer: Own SQL analytics pipelines and reporting. Some backend collaboration."
        - id: platform-support
          content: "IT Support Specialist: Troubleshoot employee devices, accounts and office software."
        - id: payments-engineer
          content: "Software Engineer, Payments: Maintain transaction services, API reliability and on-call systems."
    metadata:
      relevant_listing_ids: [backend-role, payments-engineer]
      hard_negative_listing_ids: [data-engineer, platform-support]
    evaluators:
      - JobRelevanceMetrics

