cases:
  - name: correction-preserves-contributor-ownership
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Logistics
            title: Engineer
            highlights:
              - id: highlight-1
                content: Led the migration of the billing API and updated its integration tests.
      feedback: I did not lead the migration. I migrated the billing endpoints and updated the integration tests as part of the platform team. That is all the detail I have; improve this without questions or metrics.
  - name: qualitative-result-needs-no-metric
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Clinic
            title: Receptionist
            highlights:
              - id: highlight-1
                content: Rewrote the patient check-in guide to clarify paperwork and reduce repeated questions at reception.
      feedback: Keep the qualitative result and make this easier to read. We did not measure a percentage. No further details are available, so propose a revision now.
  - name: ask-for-contribution-and-use-answer
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Retail
            title: Store Assistant
            highlights:
              - id: highlight-1
                content: Helped improve stock management.
      feedback: Ask me one question about my own contribution before rewriting this.
      answer: I created a shared stock count sheet so staff could see which items needed reordering. I do not have measurements or further details; use that to revise now.
      expects_question: true
  - name: summary-keeps-supported-background
    inputs:
      section: summary
      library:
        summary: Store assistant who maintains inventory records and helps colleagues use a shared count sheet.
      feedback: Make the wording clearer while keeping the supplied background. Do not add seniority or metrics; no further facts are available. Propose a revision now.
  - name: project-preserves-contributor-role
    inputs:
      section: projects
      library:
        projects:
          - id: project-1
            name: Billing migration
            role: Contributor
            description: Migrated the billing endpoints and updated integration tests with the platform team.
      feedback: Keep my role as a contributor, retain the technical detail, and improve the wording. No outcome measurements or further facts are available; propose a revision now.
  - name: fact-response-stays-on-requirement
    inputs:
      section: facts
      library:
        facts:
          - id: fact-1
            requirement: Inventory management experience
            response: I maintained the store stock count sheet so colleagues could see which items needed reordering.
      feedback: Make my answer easier to read without changing the requirement or claiming I led the team. No further facts are available; propose a revision now.
  - name: vague-clinical-assistance-prompts-natural-question
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Community Health Centre
            title: Clinical Observer
            highlights:
              - id: highlight-1
                content: Observed three community physicians and supported care for 120 rural patients, learning about community medicine.
      feedback: Improve clarity and specificity while preserving the facts.
      answer: I observed consultations and directed patients to the right waiting area. I did not provide clinical care. No other details are available; propose the revision now.
      expects_question: true
  - name: wording-only-does-not-resolve-vague-assistance
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Community Health Centre
            title: Clinical Observer
            highlights:
              - id: highlight-1
                content: Observed three community physicians and supported care for 120 rural patients, learning about community medicine.
      feedback: Keep both the observation and assisting parts. Improve the wording only; I cannot provide any further detail about what I did.
    metadata:
      allowed_colors: [red, yellow]
  - name: concrete-observation-needs-no-hands-on-care
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Community Health Centre
            title: Clinical Observer
            highlights:
              - id: highlight-1
                content: Observed rural consultations to learn how family physicians take histories and decide when to refer patients to specialists.
      feedback: Clarify the wording while keeping this observational. Do not imply that I provided care. No further facts are available; propose a revision now.
    metadata:
      allowed_colors: [green]
  - name: review-answer-enriches-contribution-without-more-questions
    inputs:
      library:
        experiences:
          - id: role-1
            company: Example Logistics
            title: Engineer
            highlights:
              - id: highlight-1
                content: Helped migrate services.
      review_question: Which part of the migration did you personally handle?
      feedback: I migrated billing endpoints and updated integration tests with the platform team. I do not know the outcome yet.
  - name: review-answer-preserves-unknown-project-outcome
    inputs:
      section: projects
      library:
        projects:
          - id: project-1
            name: Stock count sheet
            description: Helped improve stock management.
      review_question: What did you personally create or change?
      feedback: I created a shared stock count sheet to identify items needing reordering. I do not know whether anyone used it.
evaluators:
  - EditStructure
