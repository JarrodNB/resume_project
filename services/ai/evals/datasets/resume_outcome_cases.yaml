      supported:
        - {requirement: backend python, any_of: [Python]}
        - {requirement: aws, any_of: [AWS, ECS, EC2]}
        - {requirement: containers, any_of: [Docker, ECS]}
        - {requirement: observability, any_of: [Datadog, dashboards]}
