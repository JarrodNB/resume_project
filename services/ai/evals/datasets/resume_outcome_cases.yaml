              - Wrote the team's incident review template
          - company: Brightcart
            title: Software Engineer
            start_date: 2017-06-01
            end_date: 2021-02-01
            highlights:
              - Built order management services in Python and Django
              - Worked on the build pipeline
              - Cut nightly batch runtime from 6 hours to 90 minutes by rewriting the reconciliation job
              - Helped with Black Friday readiness
          - company: Campus IT Services
            title: Student Developer
            start_date: 2015-09-01
            end_date: 2017-05-01
            highlights:
              - Maintained the course registration website in PHP
        projects:
          - name: tinyqueue
            description: Open-source Go job queue with 400 GitHub stars
        educations:
          - institution: State University
            degree: BSc
            field_of_study: Computer Science
            start_date: 2013-09-01
            end_date: 2017-05-01
        skills:
          - {name: Python, category: Languages}
          - {name: Go, category: Languages}
          - {name: PHP, category: Languages}
          - {name: AWS, category: Cloud}
          - {name: Docker, category: Cloud}
          - {name: CloudFormation, category: Cloud}
          - {name: Datadog, category: Tools}
          - {name: Django, category: Frameworks}
