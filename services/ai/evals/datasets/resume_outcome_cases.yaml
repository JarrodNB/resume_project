# Description: Realistic synthetic applicants for the end-to-end resume outcome eval.
# People, employers and jobs are invented. Each case holds a full library and job posting.
# metadata.supported: requirements the library really backs, with terms that would show it.
# Terms match whole words, ignoring case; a trailing * matches any word ending.
# metadata.traps: things the job wants that this person lacks; claiming one is a false claim.
# metadata.notes: what the person knows but never wrote down. Only the simulated applicant sees
# these, and only facts it volunteers in answers may reach the resume.
# metadata.hidden_facts: which notes count as recovered, with marker terms to look for.
cases:
