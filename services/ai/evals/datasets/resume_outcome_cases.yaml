        On the build pipeline at Brightcart I reduced deploy time from 40 minutes to 12 minutes by parallelizing tests.
        I led the on-call rotation for payouts at Ledgerly for two years and cut weekly pages from about 30 to 9.
        I did a two-day Kubernetes course once but have never run Kubernetes in production.
