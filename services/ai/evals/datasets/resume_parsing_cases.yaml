# Description: Hand-labelled eval cases for the resume parsing agent. All resumes are synthetic.
# `inputs` is resume text as extracted from a file; `expected_output` is a ParsedResume.
# Metadata:
#   - ambiguous_entries: company names that may reasonably land in experiences or projects
#   - expects_warning: the agent should explain an ambiguity in parsing_warnings
cases:
  - name: chronological_backend_engineer
    inputs: |
      ALEX RIVERA
      Seattle, WA | alex.rivera@example.com | (206) 555-0142 | github.com/alexrivera-dev

      SUMMARY
      Backend engineer with 6 years of experience building payment and data platforms.

      EXPERIENCE
      Senior Software Engineer — Northwind Payments, Seattle, WA
      March 2022 – Present
      • Led the migration of the ledger service from a monolith to event-driven microservices, cutting settlement latency by 40%.
      • Designed an idempotent retry framework used by 12 internal services.
      • Mentored four junior engineers through quarterly growth plans.

      Software Engineer — Contoso Analytics, Remote
      June 2018 – February 2022
      • Built ETL pipelines in Python and Airflow processing 2 TB of event data per day.
      • Reduced AWS spend by $180K per year by rightsizing Redshift clusters.

      EDUCATION
      University of Washington — B.S. Computer Science, 2014 – 2018

      SKILLS
      Languages: Python, Go, SQL
      Infrastructure: AWS, Kubernetes, Terraform, Kafka
    expected_output:
      contact:
        full_name: Alex Rivera
        email: alex.rivera@example.com
        phone: (206) 555-0142
        location: Seattle, WA
        links: [{label: GitHub, url: "https://github.com/alexrivera-dev"}]
      summary: Backend engineer with 6 years of experience building payment and data platforms.
      experiences:
        - company: Northwind Payments
          title: Senior Software Engineer
          location: Seattle, WA
          start_date: "2022-03"
          end_date: null
          is_current: true
          highlights:
            - Led the migration of the ledger service from a monolith to event-driven microservices, cutting settlement latency by 40%.
            - Designed an idempotent retry framework used by 12 internal services.
            - Mentored four junior engineers through quarterly growth plans.
        - company: Contoso Analytics
          title: Software Engineer
          location: Remote
          start_date: "2018-06"
          end_date: "2022-02"
          is_current: false
          highlights:
            - Built ETL pipelines in Python and Airflow processing 2 TB of event data per day.
            - Reduced AWS spend by $180K per year by rightsizing Redshift clusters.
      educations:
        - institution: University of Washington
          degree: B.S.
          field_of_study: Computer Science
          start_date: "2014"
          end_date: "2018"
      skills:
        - {name: Python, category: Languages}
        - {name: Go, category: Languages}
        - {name: SQL, category: Languages}
        - {name: AWS, category: Infrastructure}
        - {name: Kubernetes, category: Infrastructure}
        - {name: Terraform, category: Infrastructure}
        - {name: Kafka, category: Infrastructure}

