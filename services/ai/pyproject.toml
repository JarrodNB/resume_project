# Description: Python project definition for the AI worker service (dependencies and tooling).
# Index: runtime dependencies, development dependencies, uv, Ruff, and pytest configuration.
[project]
name = "ai-worker"
version = "0.1.0"
description = "SQS workers that run all LLM work for Throughline."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3",
    "httpx>=0.28.1",
    "logfire>=4.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic",
    "pydantic-ai-harness==0.53.0",
    "pydantic-ai-slim[openai,typesafe]==2.53.0",
    "pydantic-settings",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pydantic-evals==2.53.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the compose Postgres (skipped when it isn't reachable)",
    "real_guardrail: exercises capability screening with fake providers without the default classifier mock",
]
