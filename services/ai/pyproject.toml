# Description: Python project definition shared by the AI HTTP app and queue workers (dependencies and tooling).
# Index: runtime dependencies, development dependencies, uv, Ruff, and pytest configuration.
[project]
name = "careergrind-ai"
version = "0.1.0"
description = "Shared AI execution for Careergrind HTTP endpoints and queue workers."
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3",
    "click==8.3.1",
    "en-core-web-sm",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "logfire>=4.0",
    "pgvector>=0.5.0",
    "presidio-analyzer==2.2.362",
    "psycopg[binary]>=3.3.6",
    "pydantic",
    "pydantic-ai-harness==0.53.0",
    "pydantic-ai-slim[openai,typesafe]==2.53.0",
    "pydantic-settings",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "redis>=6,<9",
    "spacy==3.8.11",
    "torch>=2.7,<3",
    "transformers>=4.51,<5",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pydantic-evals==2.53.0",
    "pytest",
    "ruff",
    "watchfiles>=1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the compose Postgres (skipped when it isn't reachable)",
    "real_guardrail: exercises capability screening with fake providers without the default classifier mock",
]
