# Description: Python project definition for the AI worker service (dependencies and tooling).
[project]
name = "ai-worker"
version = "0.1.0"
description = "SQS workers that run all LLM work for Throughline."
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "langfuse>=4.16.0",
    "pydantic",
    "pydantic-ai-slim[openai]>=2.52.0",
    "pydantic-settings",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pydantic-evals>=2.52.0",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Files on the Windows -> Docker bind mount always appear executable.
ignore = ["EXE002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
