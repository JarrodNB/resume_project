# Queue housekeeping runs in both durable development and production workers.
# Feature-specific retry and cleanup jobs can use the same scheduler.

development: &recurring
  prune_ai_stream_grants:
    class: AiExecutions::PruneStreamGrantsJob
    schedule: every minute
  recover_interrupted_ai_jobs:
    class: AiExecutions::RecoverInterruptedJobsJob
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

production:
  <<: *recurring
