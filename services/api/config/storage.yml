# Description: Active Storage services. Development uploads to S3Mock (docker compose `s3`);
# tests use the local disk. The bucket and endpoint come from S3_UPLOADS_BUCKET / S3_ENDPOINT_URL,
# and the AI worker reads uploads from the same bucket by blob key.
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_UPLOADS_BUCKET", "throughline-uploads") %>
  <% if ENV["S3_ENDPOINT_URL"].present? %>
  endpoint: <%= ENV["S3_ENDPOINT_URL"] %>
  force_path_style: true
  <% end %>
