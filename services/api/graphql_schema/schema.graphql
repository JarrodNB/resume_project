  The latest comparison failed; try it again.
  """
  COMPARISON_FAILED

  """
  The job is being compared with the career library.
  """
  COMPARISON_RUNNING

  """
  Nothing left to do (offer or rejection).
  """
  NONE

  """
  Interviewing; practice for it.
  """
  PRACTICE_INTERVIEW

  """
  A resume is saved; apply to the job.
  """
  READY_TO_APPLY

  """
  The latest resume draft failed; try it again.
  """
  RESUME_FAILED

  """
  A tailored resume is being written.
  """
  RESUME_RUNNING

  """
