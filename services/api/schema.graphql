type AiTask {
  """
  When the user accepted the result into their data (e.g. imported a parsed resume).
  """
  acceptedAt: ISO8601DateTime
  completedAt: ISO8601DateTime
  createdAt: ISO8601DateTime!
  errorMessage: String
  id: ID!

  """
  Questions the AI is waiting on when status is NEEDS_USER_INPUT.
